<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="Cute cat illustration">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5CBA7"/>
      <stop offset="100%" stop-color="#E09469"/>
    </linearGradient>
  </defs>
  <!-- body --> 
  <ellipse cx="210" cy="190" rx="120" ry="72" fill="url(#fur)" opacity="0.95"/>
  <!-- tail --> 
  <path d="M330 180 C360 160, 360 230, 320 210" fill="url(#fur)"/>
  <!-- head --> 
  <ellipse cx="210" cy="110" rx="66" ry="58" fill="url(#fur)"/>
  <!-- ears --> 
  <polygon points="162,60 210,22 234,68" fill="url(#fur)"/>
  <polygon points="258,60 210,22 186,68" fill="url(#fur)"/>
  <!-- inner ear shading --> 
  <polygon points="170,82 198,52 210,74" fill="#ffd9b3" opacity="0.8"/>
  <polygon points="222,82 190,52 210,74" fill="#ffd9b3" opacity="0.8"/>
  <!-- eyes --> 
  <circle cx="190" cy="118" r="6" fill="#1f1f1f"/>
  <circle cx="230" cy="118" r="6" fill="#1f1f1f"/>
  <!-- nose --> 
  <polygon points="210,128 214,132 206,132" fill="#e26a6a"/>
  <!-- whiskers --> 
  <path d="M150 128 H180" stroke="#333" stroke-width="2" />
  <path d="M150 134 H180" stroke="#333" stroke-width="2" />
  <path d="M150 140 H180" stroke="#333" stroke-width="2" />
  <path d="M240 128 H270" stroke="#333" stroke-width="2" />
  <path d="M240 134 H270" stroke="#333" stroke-width="2" />
  <path d="M240 140 H270" stroke="#333" stroke-width="2" />
</svg>
